name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  HEROKU_APP_NAME: sunlit-garden-api

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: HEROKU_API_KEY # Environment name where the secrets are stored

    steps:
      - name: Debug Trigger Event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Branch name: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy test env file
        run: cp test/.env.test .env.test

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

      # Deploy to Heroku (only on push to main)
      - name: Install Heroku CLI
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Configure Docker for Heroku
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Deploy to Heroku
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          # Set config vars in Heroku
          heroku config:set \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            JWT_EXPIRATION_TIME="24h" \
            MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            NODE_ENV="production" \
            PORT="3000" \
            ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}" \
            RATE_LIMIT_TTL="60000" \
            RATE_LIMIT_MAX="50" \
            GRAPHQL_PLAYGROUND="true" \
            GRAPHQL_DEBUG="false" \
            GRAPHQL_INTROSPECTION="false" \
            SECURE_COOKIES="true" \
            CORS_CREDENTIALS="true" \
            -a ${{ env.HEROKU_APP_NAME }}

          # Build and deploy container
          docker build -t registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web .
          docker push registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web
          heroku container:release web -a ${{ env.HEROKU_APP_NAME }}
