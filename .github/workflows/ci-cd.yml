name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  HEROKU_APP_NAME: sunlit-garden-api

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Debug Trigger Event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Branch name: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy test env file
        run: cp test/.env.test .env.test

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

      # Build and deploy to Heroku
      - name: Deploy to Heroku
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Logging in to Heroku..."
          heroku container:login
          echo "Building and pushing to ${{ env.HEROKU_APP_NAME }}..."
          heroku container:push web -a ${{ env.HEROKU_APP_NAME }}
          echo "Releasing to ${{ env.HEROKU_APP_NAME }}..."
          heroku container:release web -a ${{ env.HEROKU_APP_NAME }}
          echo "Deployment completed successfully"
          echo "Deployment URL: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com"
