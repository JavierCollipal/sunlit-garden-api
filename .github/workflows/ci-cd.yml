name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  HEROKU_APP_NAME: sunlit-garden-api

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Debug Trigger Event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Branch name: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy test env file
        run: cp test/.env.test .env.test

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

      # Build and push Docker image if tests pass
      - name: Build Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          docker build -t registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web .
          echo "Docker image built successfully"

      - name: Log in to Heroku Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Logging in to Heroku Container Registry..."
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          echo "Login successful"

      - name: Push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "Pushing image to Heroku Container Registry..."
          docker push registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web
          echo "Push successful"
          
      # Release the container
      - name: Release to Heroku
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:release web -a ${{ env.HEROKU_APP_NAME }}
          echo "Deployment URL: https://${{ env.HEROKU_APP_NAME }}.herokuapp.com"
